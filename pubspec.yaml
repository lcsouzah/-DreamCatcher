name: dreamcatcher
description: "Sleep-to-earn app powered by $DREAM token."
publish_to: 'none'

version: 1.1.0+11




environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # Core state & HTTP
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.2.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  package_info_plus: ^9.0.1
  share_plus: ^12.0.2
  permission_handler: ^12.0.1
  flutter_dotenv: ^6.0.0
  supabase_flutter: ^2.5.7
  health: ^13.3.1

  # Cupertino icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/dreamcatcher_logo.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/logo/dreamcatcher_logo.png"

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo/dreamcatcher_logo.png